name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
    - name: Test
      run: ./mill -i __.test

  bin-compat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
    - name: Check
      run: ./mill -i __.mimaReportBinaryIssues

  readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
    - name: Validate README
      run: ./mill -i mdoc

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: 21
      - name: Publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "coursier-versions-${GITHUB_REF#refs/tags/v}"
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
